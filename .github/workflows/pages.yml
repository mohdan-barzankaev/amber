name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7
      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить код
        run: npm run lint
      - name: Запустить тесты
        run: npm test
      - name: Собрать сайт
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - name: Подготовить прямые ссылки на страницы
        if: github.event_name != 'pull_request'
        run: cp dist/index.html dist/404.html
      - name: Сохранить сайт для GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v5
